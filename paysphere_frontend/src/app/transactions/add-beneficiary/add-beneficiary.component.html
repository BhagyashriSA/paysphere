<div class="beneficiary-container">

  <div class="beneficiary-card">

    <div class="header-section">
      <h2>Add Beneficiary</h2>
      <p>Add trusted bank account for secure fund transfer</p>
    </div>

    <form [formGroup]="beneficiaryForm" (ngSubmit)="submit()">

      <div class="grid-container">

        <!-- Beneficiary Name -->
        <div class="form-group">
          <label>Beneficiary Name</label>
          <input
            type="text"
            formControlName="beneficiaryName"
            placeholder="Enter beneficiary name">

          <small *ngIf="submitted && f['beneficiaryName'].errors">
            Beneficiary name is required
          </small>
        </div>

        <!-- Account Number -->
        <div class="form-group">
          <label>Account Number</label>
          <input
            type="text"
            formControlName="accountNumber"
            placeholder="Enter account number">

          <small *ngIf="submitted && f['accountNumber'].errors">
            Valid account number is required
          </small>
        </div>

        <!-- IFSC -->
        <div class="form-group">
          <label>IFSC Code</label>
          <input
            type="text"
            formControlName="ifscCode"
            placeholder="Enter IFSC code">

          <small *ngIf="submitted && f['ifscCode'].errors">
            IFSC code is required
          </small>
        </div>

        <!-- Bank Name -->
        <div class="form-group">
          <label>Bank Name</label>
          <input
            type="text"
            formControlName="bankName"
            placeholder="Enter bank name">

          <small *ngIf="submitted && f['bankName'].errors">
            Bank name is required
          </small>
        </div>

        <!-- Branch Name -->
        <div class="form-group">
          <label>Branch Name</label>
          <input
            type="text"
            formControlName="branchName"
            placeholder="Enter branch name">

          <small *ngIf="submitted && f['branchName'].errors">
            Branch name is required
          </small>
        </div>

        <!-- Account Type -->
        <div class="form-group">
          <label>Account Type</label>

          <select formControlName="accountType">
            <option value="">Select Account Type</option>

            <option
              *ngFor="let type of accountTypes"
              [value]="type">
              {{ type }}
            </option>
          </select>

          <small *ngIf="submitted && f['accountType'].errors">
            Account type is required
          </small>
        </div>

        <!-- Nick Name -->
        <div class="form-group full-width">
          <label>Nick Name</label>
          <input
            type="text"
            formControlName="nickName"
            placeholder="Enter nick name">

          <small *ngIf="submitted && f['nickName'].errors">
            Nick name is required
          </small>
        </div>

      </div>

      <!-- Success Message -->
      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <!-- Error Message -->
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Button -->
      <div class="button-section">
        <button type="submit">
          Add Beneficiary
        </button>
      </div>

    </form>
  </div>
</div>
